name = "trust-solstone-app"
account_id = "3f2c1528c7d4d9685819ea9e9e307c92"
compatibility_date = "2025-04-01"
main = "worker.ts"

# The portal is reached only via the custom domain -- no *.workers.dev preview
# hostname, so there is never a second, unlisted, un-indexed origin for the
# same read-only content.
workers_dev = false

routes = [{ pattern = "trust.solstone.app", custom_domain = true }]

# This surface's own claim is that visitors aren't measured, so per-request
# metadata is never persisted -- stated explicitly rather than left to
# whatever Cloudflare's platform default happens to be.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

# The one static file this surface serves that isn't generated in-memory by
# the Worker (the vendored brand font). Requests are routed to this binding
# explicitly inside worker.ts, not via Cloudflare's default assets-first
# behavior, so every non-static-asset path still reaches handle() and every
# response header still comes from the one approved policy.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
